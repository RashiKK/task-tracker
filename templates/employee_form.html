{% extends "base.html" %}{% block title %}{{ 'Edit' if person else 'Add' }} person{% endblock %}{% block body %}
{% set f = form or person or {} %}<h1>{{ 'Edit person' if person else 'Add person' }}</h1>
<form class="panel form" method="post"><label>Full name<input name="name" value="{{ f.name }}" required></label>
<label>Username<input name="username" value="{{ f.username }}" required autocomplete="off"></label>
<label>Department<input name="department" value="{{ f.department }}"></label>
<label>Role<select name="role" {{ 'disabled' if person and person.id == g.user.id }}><option value="employee" {{ 'selected' if f.role == 'employee' }}>Employee</option><option value="manager" {{ 'selected' if f.role == 'manager' }}>Manager</option></select></label>
<label>{{ 'New password (leave blank to keep the current one)' if person else 'Password (at least 6 characters)' }}<input name="password" type="password" minlength="6" autocomplete="new-password" {{ 'required' if not person }}></label>
<div class="row"><button>Save person</button><a class="btn ghost" href="{{ url_for('staff') }}">Cancel</a></div></form>{% endblock %}
